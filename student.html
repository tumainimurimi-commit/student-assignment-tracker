<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="student.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <title>Student Assignment Tracker</title>
</head>
<body>

  <!--The head part of the html page-->
  <header class="navbar">
    <form class="search-form" role="search" id="submitForm">
      <label for="searchInput" class="visually-hidden">Search assignments</label>
      <input type="text" id="searchInput" placeholder="Search assignments...">
      <button type="submit" aria-label="Search">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </form>

    <p class="greeting-message" id="greetingMessage">Hello, Tumaini</p>

    <div class="navbar-actions">
      <button type="button" id="notificationBell" class="notification-bell" aria-label="Notifications">
        <i class="fa-solid fa-bell"></i>
      </button>
      <!--The profile avatar — the young man picture is injected by JavaScript-->
      <div class="avatar" aria-label="Profile" id="avatarProfile"></div>
    </div>
  </header>

  <main>
    <!--The summary card that dispalys summary of the page-->
    <section class="summary-display">
      <div class="summary-card">
        <span class="card-icon icon-overdue"><i class="fa-solid fa-triangle-exclamation"></i></span>
        <div class="card-body">
          <span class="card-data" id="overdueInfo">0</span>
          <span class="card-info">Overdue</span>
        </div>
      </div>

      <div class="summary-card">
        <span class="card-icon icon-week"><i class="fa-solid fa-calendar-week"></i></span>
        <div class="card-body">
          <span class="card-data" id="dueInfo">0</span>
          <span class="card-info">Due This Week</span>
        </div>
      </div>

      <div class="summary-card">
        <span class="card-icon icon-today"><i class="fa-solid fa-clock"></i></span>
        <div class="card-body">
          <span class="card-data" id="dueTodayInfo">0</span>
          <span class="card-info">Due Today</span>
        </div>
      </div>

      <div class="summary-card">
        <span class="card-icon icon-completed"><i class="fa-solid fa-circle-check"></i></span>
        <div class="card-body">
          <span class="card-data" id="completedInfo">0</span>
          <span class="card-info">Completed</span>
        </div>
      </div>
    </section>

    <!--The filter buttons on the HTML page-->
    <section class="filter-info">
      <div class="filter-chips" id="filterContainer">
        <button type="button" class="filter-btn active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="dueToday">Due Today</button>
        <button type="button" class="filter-btn" data-filter="thisWeek">This Week</button>
        <button type="button" class="filter-btn" data-filter="overdue">Overdue</button>
        <button type="button" class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <button type="button" id="clearFilter" class="clear-btn">Clear Filters</button>
    </section>

    <!--The task adding and submitting form-->
    <section class="task-form-section">
      <h2 class="task-form-title">Add Assignment</h2>
      <form id="taskForm" class="task-form">
        <input type="text" id="taskTitleInput" placeholder="Add Assignment..." required>
        <input type="text" id="taskCourseInput" placeholder="Course e.g. Information Technology" required>
        <input type="datetime-local" id="taskInputDue" required>
        <select id="taskPriorityInput" required>
          <option value="">Priority</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <button type="submit">Add Task</button>
      </form>
    </section>

    <!--The list of the task assigned — filled in by JavaScript-->
    <section class="task-list">
      <ul id="taskList"></ul>
    </section>
  </main>

  <script src="student.js"></script>
</body>
</html>
